name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: kernel + replacement audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"

      - name: Replacement audit (statement, bridge, combined profile, coverage)
        run: |
          lake build Corpus.Audit
          lake env lean Corpus/Audit.lean

      - name: Adversarial audit fixtures
        run: lake env lean Corpus/AuditChecks.lean
