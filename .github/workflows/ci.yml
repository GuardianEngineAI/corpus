name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: kernel + profile audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (pinned toolchain from lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Kernel gate
        run: lake build

      - name: Axiom-profile audit (declared = computed, strict narrowing, coverage)
        run: lake env lean Corpus/Audit.lean
